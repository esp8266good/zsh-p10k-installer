name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: build
        run: ./build.sh

      - name: shellcheck
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:stable \
            -S warning dist/install-zsh-p10k.sh build.sh tests/run-fixtures.sh tests/incontainer.sh \
            tests/macos-smoke.sh

      # 打 tag 發版時，tag 必須跟腳本裡的 SCRIPT_VERSION 一致。
      # 不一致的話，使用者看到的「install-zsh-p10k v3.x.y」會跟 Release 頁面對不起來。
      - name: tag matches SCRIPT_VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="${GITHUB_REF_NAME#v}"
          got="$(sed -n 's/^SCRIPT_VERSION="\(.*\)"$/\1/p' install-zsh-p10k.sh.in)"
          [ "$want" = "$got" ] || { echo "tag $GITHUB_REF_NAME 與 SCRIPT_VERSION=$got 不一致" >&2; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/install-zsh-p10k.sh

  fixtures:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fixture:
          - fresh-bash
          - zsh-no-omz
          - v2-installed
          - native-omz
          - v2-with-user-edits
          - has-desktop
          - forwarded-display
          - hook-fallback
          - ancient-awk
          - dotfiles-symlink
          - sticky-options
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: installer
          path: dist
      - name: run fixture
        run: ./tests/run-fixtures.sh "${{ matrix.fixture }}"

  # macOS：每個情境都用暫存 HOME，iTerm2 也裝到暫存目錄，不碰 runner 的 /Applications。
  # macos-15 是 Apple silicon，macos-15-intel 是 Intel。
  # runner 預裝了 Xcode，「沒有 Command Line Tools」的情境是用假的 xcode-select -p 模擬的。
  macos:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: installer
          path: dist
      - name: smoke test
        run: bash ./tests/macos-smoke.sh

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fixtures, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installer
          path: dist
      - name: checksums
        run: cd dist && sha256sum install-zsh-p10k.sh > SHA256SUMS
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/install-zsh-p10k.sh dist/SHA256SUMS
